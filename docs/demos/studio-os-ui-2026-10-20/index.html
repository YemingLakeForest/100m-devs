<title>Studio OS Redesign</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a page drawn as Studio OS itself - one scaled 1280x720 game frame per screen, BEFORE/AFTER toggle, notes under it.
   Single dark theme on purpose: this is the game's CRT world, palette straight from src/art/palette.ts. */
@font-face { font-family: 'Departure Mono'; src: url('assets/departure.woff2') format('woff2'); font-display: block; }
:root {
  color-scheme: dark;
  --n0: #181919; --n1: #292a29; --n2: #3c3e3c; --n3: #575a56; --n4: #767970; --n5: #97988f; --n6: #b8b9b0; --n7: #d9d8cd; --n8: #f1efe6;
  --calm0: #0a2a30; --calm1: #1a6b78; --calm2: #35c9d9; --calm3: #b8f4ff;
  --warn1: #8a5c12; --warn2: #e0a52e; --warn3: #ffe9b0;
  --alarm1: #8a1f1f; --alarm2: #e03c3c; --alarm3: #ffb8b8;
  --glow1: #4a8fa8;
  --eng: #d8d8c0; --rel: #d05050; --sup: #78c078; --coh: #b088d0;
  --mono: 'Departure Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
  --t1: 11px; --t2: 22px; --t3: 33px;
}
* { box-sizing: border-box; }
html, body { background: var(--n0); color: var(--n7); }
body { font-family: var(--mono); font-size: var(--t1); line-height: 1.5; -webkit-font-smoothing: none; font-smooth: never; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 1px solid var(--warn2); outline-offset: 2px; }

.page { max-width: 1440px; margin: 0 auto; padding-block: 20px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; }
.masthead { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; border-bottom: 1px solid var(--calm1); padding-bottom: 10px; }
.masthead h1 { margin: 0; font-size: var(--t2); font-weight: 400; color: var(--n8); letter-spacing: .04em; }
.masthead h1 span { color: var(--calm1); }
.masthead p { margin: 0; color: var(--n5); max-width: 70ch; }

/* Page controls obey the rule being demoed: outline = clickable, fill = selected. */
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.tabs, .seg { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: transparent; border: 1px solid var(--calm1); color: var(--calm2); padding: 6px 12px; cursor: pointer; letter-spacing: .08em; text-transform: uppercase; }
.chip:hover { border-color: var(--calm2); }
.chip[aria-pressed="true"], .chip[aria-selected="true"] { background: var(--calm2); border-color: var(--calm2); color: var(--n0); }
.chip .num { color: inherit; opacity: .6; margin-right: 6px; }

.stage { position: relative; width: 100%; aspect-ratio: 1280 / 720; overflow: hidden; border: 1px solid var(--calm1); background: var(--n0); }
.frame { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; transform: scale(var(--k, 1)); overflow: hidden; }
.before-img { position: absolute; left: 0; top: -66.5px; width: 1280px; height: auto; image-rendering: auto; }
.room { position: absolute; inset: 0; background: url('assets/room.jpg') center / cover no-repeat; }
.scrim { position: absolute; inset: 0; background: rgba(24, 25, 25, .78); }

.notes { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.note { border: 1px solid var(--n2); padding: 12px 14px; min-width: 0; }
.note h2 { margin: 0 0 8px; font-size: var(--t1); font-weight: 400; letter-spacing: .12em; color: var(--calm2); }
.note ul { margin: 0; padding-left: 16px; display: grid; gap: 6px; }
.note p { margin: 0; color: var(--n6); }
.note .gdd { color: var(--warn2); }
.note b { color: var(--n8); font-weight: 400; }
.note .chip { margin-top: 10px; }

/* ---------- inside the frame ---------- */
.y { color: var(--warn2); }
.dim { color: var(--n4); }
.lbl { color: var(--n5); letter-spacing: .1em; text-transform: uppercase; }

/* status bar */
.status { position: absolute; left: 0; right: 0; top: 0; height: 40px; background: var(--n0); border-bottom: 1px solid var(--calm1); display: flex; align-items: stretch; z-index: 5; }
.status .logo { display: flex; align-items: center; gap: 8px; padding: 0 14px; border-right: 1px solid var(--n2); color: var(--calm2); letter-spacing: .12em; }
.status .proj { display: flex; align-items: center; gap: 10px; padding: 0 14px; border-right: 1px solid var(--n2); cursor: default; }
.steps { display: inline-flex; gap: 2px; }
.steps i { width: 6px; height: 8px; background: var(--n2); }
.steps i.on { background: var(--calm2); }
.read { display: flex; align-items: center; gap: 8px; padding: 0 12px; border-right: 1px solid var(--n2); cursor: default; white-space: nowrap; }
.mrow .segm { justify-self: start; }
.verbs { padding-right: 18px !important; }
.read svg { flex: none; }
.read b { font-weight: 400; font-size: var(--t2); line-height: 1; color: var(--n8); }
.read .sub { color: var(--n5); }
.read.cash b { color: var(--warn2); }
.read.warn b { color: var(--warn2); }
.read:hover, .proj:hover { background: var(--n1); }
.status .clock { margin-left: auto; display: flex; align-items: center; gap: 10px; padding: 0 14px; color: var(--n5); border-left: 1px solid var(--n2); }

/* hero rail + owned strip */
.row2 { position: absolute; left: 12px; right: 12px; top: 46px; height: 50px; display: flex; gap: 10px; align-items: flex-start; z-index: 4; }
.rail, .owned { display: flex; gap: 4px; background: var(--n0); border: 1px solid var(--n2); padding: 4px; }
.face { position: relative; width: 40px; height: 40px; padding: 0; border: 1px solid var(--n3); background: var(--n1); cursor: pointer; }
.face img { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
.face::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--hc); }
.face:hover { border-color: var(--calm2); }
.face .ctr { position: absolute; right: -1px; top: -1px; background: var(--n0); color: var(--hc); border: 1px solid var(--hc); padding: 0 3px; line-height: 12px; font-size: var(--t1); }
.relic { position: relative; width: 40px; height: 40px; border: 1px solid var(--n2); background: var(--n1); display: grid; place-items: center; cursor: default; }
.relic:hover { border-color: var(--calm2); }
.relic .n { position: absolute; right: 1px; bottom: -1px; color: var(--warn2); }
.owned .cap { align-self: center; padding: 0 6px; color: var(--n5); }

.bubble { position: absolute; left: 50%; top: 104px; transform: translateX(-50%); background: var(--n0); border: 1px solid var(--n7); padding: 8px 16px; font-size: var(--t2); color: var(--n8); white-space: nowrap; z-index: 3; }
.bubble small { display: block; font-size: var(--t1); color: var(--n5); }
.ticker { position: absolute; left: 12px; bottom: 52px; background: var(--n0); border-left: 2px solid var(--calm2); padding: 4px 10px; color: var(--n7); z-index: 3; }

/* taskbar */
.task { position: absolute; left: 0; right: 0; bottom: 0; height: 46px; background: var(--n0); border-top: 1px solid var(--calm1); display: flex; align-items: stretch; z-index: 6; }
.start { display: flex; align-items: center; gap: 8px; padding: 0 14px; color: var(--calm2); border-right: 1px solid var(--n2); letter-spacing: .12em; }
.app { position: relative; display: flex; align-items: center; gap: 8px; padding: 0 14px; background: transparent; border: 0; border-right: 1px solid var(--n2); color: var(--n6); cursor: pointer; letter-spacing: .08em; }
.app:hover { background: var(--n1); color: var(--n8); }
.app[aria-current="true"] { background: var(--calm2); color: var(--n0); }
.app[aria-current="true"] svg rect { fill: var(--n0) !important; }
.badge { background: var(--warn2); color: var(--n0); padding: 0 4px; line-height: 14px; }
.app[aria-current="true"] .badge { background: var(--n0); color: var(--warn2); }
.verbs { margin-left: auto; display: flex; align-items: center; gap: 10px; padding: 0 12px; }

/* §10.8a buttons: skewed, flat slab. Outline = can press. Fill = THE thing to press. */
.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 32px; padding: 4px 16px; background: transparent; border: 1px solid var(--calm2); color: var(--calm2); transform: skewX(-4deg); cursor: pointer; letter-spacing: .1em; text-transform: uppercase; }
.btn > * { transform: skewX(4deg); }
.btn:hover { background: var(--calm0); }
.btn.primary { background: var(--calm2); color: var(--n0); box-shadow: 3px 3px 0 0 var(--calm1); }
.btn.primary:hover { background: var(--calm3); }
.btn.big { min-height: 36px; font-size: var(--t2); padding: 2px 20px; }
.btn .s { font-size: var(--t1); opacity: .75; }
.btn.danger { border-color: var(--alarm2); color: var(--alarm2); }
.btn.danger:hover { background: var(--alarm1); color: var(--alarm3); }
.btn.danger.armed { background: var(--alarm2); color: var(--n0); }
.btn[disabled] { border-color: var(--n3); color: var(--n4); cursor: not-allowed; background: transparent; box-shadow: none; }
.btn.press { animation: press 160ms steps(2, end); }
@keyframes press { 50% { transform: skewX(-4deg) translate(2px, 2px); box-shadow: 1px 1px 0 0 var(--calm1); } }

/* window */
.win { position: absolute; left: 16px; right: 16px; top: 46px; bottom: 52px; background: var(--n0); border: 1px solid var(--calm2); display: flex; flex-direction: column; z-index: 5; animation: winin 280ms steps(4, end); }
.win.narrow { left: 50%; right: auto; width: var(--w, 700px); transform: translateX(-50%); }
@keyframes winin { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0 0 0 0); } }
.win > header { height: 28px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 0 0 12px; border-bottom: 1px solid var(--calm1); letter-spacing: .14em; }
.win > header .path { color: var(--calm1); }
.win > header .path b { color: var(--n8); font-weight: 400; }
.win > header .meta { margin-left: auto; color: var(--warn2); letter-spacing: .04em; }
.win > header .x { width: 28px; height: 27px; border: 0; border-left: 1px solid var(--calm1); background: transparent; color: var(--calm2); cursor: pointer; }
.win > header .x:hover { background: var(--calm2); color: var(--n0); }
.win .body { flex: 1; min-height: 0; }

/* tooltip */
.tip { position: absolute; z-index: 20; width: 270px; background: var(--n0); border: 1px solid var(--calm2); animation: tipin 120ms steps(2, end); }
.tip.chain { border-color: var(--warn2); width: 230px; }
@keyframes tipin { from { clip-path: inset(0 0 60% 0); } to { clip-path: inset(0); } }
.tip .th { display: flex; justify-content: space-between; gap: 8px; padding: 5px 8px; border-bottom: 1px solid var(--n2); }
.tip .th b { color: var(--n8); font-weight: 400; }
.tip .tag { color: var(--n5); letter-spacing: .1em; }
.tip .tag.hero { color: var(--hc); }
.tip .rows { padding: 4px 8px; border-bottom: 1px solid var(--n2); display: grid; gap: 1px; }
.tip .rows div { display: flex; justify-content: space-between; gap: 10px; }
.tip .rows span:first-child { color: var(--n5); }
.tip .tb { padding: 6px 8px; color: var(--n7); }
.tip .hint { padding: 0 8px 6px; color: var(--n4); }
.kw { color: var(--calm2); border-bottom: 1px dotted var(--calm1); cursor: help; }

/* ---------- PERSONNEL ---------- */
.ptabs { display: flex; gap: 0; border-bottom: 1px solid var(--n2); flex: none; }
.ptab { display: flex; align-items: center; gap: 8px; padding: 4px 14px 4px 4px; border: 0; border-right: 1px solid var(--n2); background: transparent; color: var(--n6); cursor: pointer; letter-spacing: .1em; }
.ptab img { width: 26px; height: 26px; image-rendering: pixelated; border-bottom: 2px solid var(--hc); }
.ptab:hover { background: var(--n1); }
.ptab[aria-selected="true"] { background: var(--calm2); color: var(--n0); }
.ptab .sp { color: var(--warn2); }
.ptab[aria-selected="true"] .sp { color: var(--n0); }
.pgrid { display: grid; grid-template-columns: 300px 1fr 290px; height: 100%; min-height: 0; }
.pass { position: relative; border-right: 1px solid var(--n2); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.pass::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--hc); }
.punch { position: absolute; top: 8px; right: 12px; width: 8px; height: 8px; border-radius: 50%; border: 1px solid var(--n4); }
.who { display: flex; gap: 12px; align-items: flex-start; }
.who img { width: 84px; height: 84px; image-rendering: pixelated; border: 1px solid var(--n3); background: var(--hc); }
.who h3 { margin: 0; font-size: var(--t3); font-weight: 400; line-height: 1; color: var(--n8); }
.who .tagrow { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; }
.branch { background: var(--hc); color: var(--n0); padding: 0 6px; letter-spacing: .1em; }
.emp { color: var(--n5); letter-spacing: .08em; }
.gem { display: inline-block; width: 8px; height: 8px; background: var(--hc); transform: rotate(45deg); margin-left: 4px; }
.role { color: var(--calm2); margin-top: 4px; letter-spacing: .08em; }
.live { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--n2); }
.live div { padding: 4px 8px; }
.live div + div { border-left: 1px solid var(--n2); }
.live b { display: block; color: var(--n8); font-weight: 400; }
.band { border: 1px solid var(--n2); }
.band .bh { display: flex; align-items: center; gap: 8px; padding: 0 8px 0 0; background: var(--bc); color: var(--n0); letter-spacing: .1em; }
.band .bh .ic { width: 22px; height: 22px; display: grid; place-items: center; background: var(--n0); }
.band .bh .k { margin-left: auto; opacity: .7; }
.band .bb { padding: 6px 8px; color: var(--n8); }
.band .fl { padding: 0 8px 6px; color: var(--n5); }
.cut { clip-path: polygon(0 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%); }
.ownedgrid { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px; }
.ownedgrid .relic { width: 36px; height: 36px; cursor: pointer; }
.ownedgrid .relic.new { animation: land 360ms steps(4, end); }
@keyframes land { 0% { transform: translateY(-10px); background: var(--calm2); } 100% { transform: none; } }
.progress { display: flex; align-items: center; gap: 8px; }
.progress .steps i { width: 9px; }

.treepane { position: relative; min-width: 0; min-height: 0; }
.treepane svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.treepane .legend { position: absolute; left: 10px; bottom: 8px; display: flex; gap: 12px; color: var(--n5); }
.treepane .legend i { display: inline-block; width: 10px; height: 10px; margin-right: 4px; vertical-align: -1px; }
.node { cursor: pointer; }
.node .top { stroke-width: 1; }
.node.owned .top { fill: var(--calm1); stroke: var(--calm2); }
.node.owned .side { fill: var(--calm0); }
.node.avail .top { fill: var(--n1); stroke: var(--calm2); }
.node.avail .side { fill: var(--n0); }
.node.avail .top { animation: blink 1.2s steps(2, end) infinite; }
@keyframes blink { 50% { stroke: var(--calm1); } }
.node.locked .top { fill: var(--n1); stroke: var(--n2); }
.node.locked .side { fill: var(--n0); }
.node.locked .ico { opacity: .35; }
.node.key .top { stroke: var(--warn2); }
.node.sel .top { stroke: var(--warn2); stroke-width: 2; }
.node:hover .top { stroke: var(--n8); }
.edge { stroke: var(--n3); stroke-width: 1; fill: none; }
.edge.live { stroke: var(--calm1); }
.nlabel { fill: var(--n6); font: 11px var(--mono); }

.insp { border-left: 1px solid var(--n2); display: flex; flex-direction: column; min-height: 0; }
.insp .ih { display: flex; gap: 10px; padding: 12px; border-bottom: 1px solid var(--n2); align-items: flex-start; }
.insp .ih .big { width: 52px; height: 52px; display: grid; place-items: center; background: var(--n1); border: 1px solid var(--n3); flex: none; }
.insp h4 { margin: 0; font-size: var(--t2); line-height: 1.1; font-weight: 400; color: var(--n8); text-wrap: balance; }
.insp .chips { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.st { padding: 0 5px; border: 1px solid currentColor; letter-spacing: .1em; }
.st.owned { color: var(--calm2); } .st.avail { color: var(--warn2); } .st.locked { color: var(--n4); } .st.key { color: var(--warn2); background: var(--warn1); border-color: var(--warn1); color: var(--warn3); }
.insp .rows { padding: 8px 12px; display: grid; gap: 2px; border-bottom: 1px solid var(--n2); }
.insp .rows div { display: flex; justify-content: space-between; }
.insp .rows span:first-child { color: var(--n5); }
.ba { margin: 10px 12px 0; border: 1px solid var(--n2); }
.ba .bah { padding: 2px 8px; background: var(--n1); color: var(--n5); letter-spacing: .1em; }
.ba .bab { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 8px; gap: 6px; }
.ba .from { color: var(--n5); font-size: var(--t2); text-align: center; }
.ba .to { color: var(--warn2); font-size: var(--t2); text-align: center; }
.ba .arrow { color: var(--n4); }
.ba .what { grid-column: 1 / -1; text-align: center; color: var(--n6); }
.insp .eff { padding: 10px 12px 0; color: var(--n8); }
.insp .flav { padding: 6px 12px 0; color: var(--n5); }
.insp .act { margin-top: auto; padding: 12px; border-top: 1px solid var(--n2); display: grid; gap: 6px; }
.insp .act .btn { width: 100%; }
.insp .act .why { color: var(--n5); text-align: center; }

/* ---------- PARADIGM ---------- */
.pdm { display: grid; grid-template-columns: 1fr 1fr; gap: 0; height: 100%; }
.pdm .col { padding: 12px 14px; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.pdm .col + .col { border-left: 1px solid var(--n2); }
.card { border: 1px solid var(--n2); display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 8px 10px; }
.card.afford { border-color: var(--calm1); }
.card h5 { margin: 0; font-size: var(--t1); font-weight: 400; color: var(--n8); letter-spacing: .04em; }
.card .lv { color: var(--n5); text-align: right; }
.card .lv .steps i { width: 5px; height: 6px; }
.card .fx { grid-column: 1 / -1; color: var(--n6); }
.card .ba2 { grid-column: 1; color: var(--n5); }
.card .ba2 .y { font-size: var(--t1); }
.card .cost { grid-column: 2; align-self: end; }
.card .cost .btn { min-height: 26px; padding: 2px 12px; }
.card .soon { grid-column: 1 / -1; color: var(--warn2); }
.grp { color: var(--calm2); letter-spacing: .14em; }
.ledger { border: 1px solid var(--n2); }
.ledger div { display: flex; justify-content: space-between; padding: 3px 8px; }
.ledger div + div { border-top: 1px solid var(--n1); }
.ledger .sum { border-top: 1px solid var(--n3) !important; color: var(--n8); }
.ledger .sum b { color: var(--warn2); font-weight: 400; font-size: var(--t2); }
.kr { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--n2); }
.kr > div { padding: 6px 8px; }
.kr > div + div { border-left: 1px solid var(--n2); }
.kr h6 { margin: 0 0 4px; font-size: var(--t1); font-weight: 400; letter-spacing: .12em; }
.kr .keep h6 { color: var(--calm2); } .kr .lose h6 { color: var(--alarm2); }
.kr ul { margin: 0; padding-left: 14px; color: var(--n6); }

/* ---------- RUN REPORT ---------- */
.rr { display: grid; grid-template-columns: 330px 1fr; height: 100%; }
.rr .l { border-right: 1px solid var(--n2); padding: 16px; display: flex; flex-direction: column; gap: 14px; align-items: center; }
.bigpass { position: relative; width: 250px; border: 1px solid var(--n3); background: var(--n1); padding: 16px 14px 12px; display: grid; justify-items: center; gap: 6px; }
.bigpass::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: var(--calm2); }
.bigpass img { width: 128px; height: 128px; image-rendering: pixelated; border: 1px solid var(--n3); }
.bigpass .nm { font-size: var(--t2); color: var(--n8); }
.stamp { position: absolute; left: 50%; top: 58px; translate: -50% 0; rotate: -12deg; border: 3px solid var(--alarm2); color: var(--alarm2); padding: 2px 10px; font-size: var(--t2); letter-spacing: .08em; background: rgba(24,25,25,.6); white-space: nowrap; }
.stamp small { display: block; font-size: var(--t1); text-align: center; letter-spacing: .14em; }
.stamp.go { animation: stamp 400ms steps(4, end) both; }
@keyframes stamp { 0% { scale: 2.2; opacity: 0; } 50% { scale: 1.3; opacity: 1; } 75% { scale: .94; } 100% { scale: 1; } }
.mvps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; width: 100%; }
.mvp { border: 1px solid var(--n2); padding: 4px; display: grid; justify-items: center; gap: 2px; text-align: center; }
.mvp img { width: 36px; height: 36px; image-rendering: pixelated; border-bottom: 2px solid var(--hc); }
.mvp b { color: var(--warn2); font-weight: 400; }
.mvp span { color: var(--n5); }
.rr .r { padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.rr .head { display: flex; align-items: baseline; gap: 12px; }
.rr .head h3 { margin: 0; font-size: var(--t3); font-weight: 400; color: var(--n8); line-height: 1; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border: 1px solid var(--n2); }

const nodeOf = (h, id) => TREES[h].find((n) => n.id === id);
const lvl = (h, id) => OWN[h][id] || 0;
const cost = (h, n) => Math.round(ERA_COST[n.era] * Math.pow(1.6, lvl(h, n.id)));
function state(h, n) {
  const l = lvl(h, n.id);
  if (l >= n.max) return 'owned';
  const ok = n.p.length === 0 || (n.all ? n.p.every((p) => lvl(h, p) > 0) : n.p.some((p) => lvl(h, p) > 0));

}

const frame = $('#frame'), stage = $('#stage');
let tipEl = null, chainEl = null;
function tipHtml(t, chain) {
  if (t.hero) {
    const H = HEROES[t.hero];
    return `<div class="th"><b>${H.name.toUpperCase()}</b><span class="tag hero" style="--hc:${H.colour}">${H.branch}</span></div>

      <div class="tb"><span class="y">${H.trait.name}</span><br>${kwHtml(H.trait.text)}</div><div class="hint">CLICK TO OPEN THEIR PASS</div>`;
  }
  return `<div class="th"><b>${esc(t.name)}</b><span class="tag">${esc(t.tag || '')}</span></div>
    ${t.rows && t.rows.length ? `<div class="rows">${t.rows.map(([k, v]) => `<div><span>${kwHtml(k)}</span><span>${kwHtml(v)}</span></div>`).join('')}</div>` : ''}
    <div class="tb">${kwHtml(t.body)}</div>${!chain && /\[\[/.test(JSON.stringify(t)) ? '<div class="hint">HOVER A <span style="color:var(--calm2)">KEYWORD</span> FOR MORE</div>' : ''}`;
}
const K = () => parseFloat(getComputedStyle(frame).getPropertyValue('--k')) || stage.clientWidth / 1280;
function place(el, target, side) {
  const k = K(), fr = frame.getBoundingClientRect(), r = target.getBoundingClientRect();
  let x = (r.left - fr.left) / k, y = (r.bottom - fr.top) / k + 6;
  if (side) { x = (r.right - fr.left) / k + 6; y = (r.top - fr.top) / k - 6; }
  frame.appendChild(el);
  const w = el.offsetWidth, h = el.offsetHeight;
  if (x + w > 1272) x = side ? (r.left - fr.left) / k - w - 6 : 1272 - w;
  if (y + h > 712) y = (r.top - fr.top) / k - h - 6;
  el.style.left = Math.max(8, x) + 'px'; el.style.top = Math.max(8, y) + 'px';
}
function showTip(target) {
  hideTip();
  let t = TIPS[target.dataset.tip];
  if (target.dataset.node) { const [h, id] = target.dataset.node.split(':'); const n = nodeOf(h, id); t = { name: n.name.toUpperCase(), tag: n.kind === 'key' ? 'BREAKTHROUGH' : 'LV ' + lvl(h, id) + '/' + n.max, rows: [], body: n.fx || n.d }; }
  if (!t) return;
  tipEl = document.createElement('div'); tipEl.className = 'tip'; tipEl.innerHTML = tipHtml(t);
  place(tipEl, target);
}
let current = null, hideT = null;
function hideTip() { clearTimeout(hideT); tipEl?.remove(); chainEl?.remove(); tipEl = chainEl = current = null; }
const cancel = () => { clearTimeout(hideT); hideT = null; };
const later = () => { cancel(); hideT = setTimeout(hideTip, 220); };
function showChain(kwEl) {
  chainEl?.remove();
  const d = KW[kwEl.dataset.kw]; if (!d) return;
  chainEl = document.createElement('div'); chainEl.className = 'tip chain'; chainEl.innerHTML = tipHtml(d, true);
  place(chainEl, tipEl || kwEl, true);
}
// A tip stays up while the pointer travels into it, so its keywords can open a second tip beside it.
frame.addEventListener('mouseover', (e) => {
  const inTip = e.target.closest('.tip');
  const kw = e.target.closest('.kw');
  if (inTip) { cancel(); if (kw && !e.target.closest('.tip.chain')) showChain(kw); return; }
  if (kw) { cancel(); if (!tipEl) current = kw; showChain(kw); return; }
  const t = e.target.closest('[data-tip],[data-node-tip]');
  if (t) {
    cancel();
    if (t !== current) { hideTip(); current = t; if (t.dataset.nodeTip) t.dataset.node = t.dataset.nodeTip; showTip(t); current = t; }
  }
});
frame.addEventListener('mouseout', (e) => {
  const from = e.target.closest('[data-tip],[data-node-tip],.tip,.kw');
  if (from && !(e.relatedTarget && from.contains(e.relatedTarget))) later();
});

        <div class="legend"><span><i style="background:var(--calm1)"></i>OWNED</span><span><i style="border:1px solid var(--calm2)"></i>CAN BUY</span><span><i style="background:var(--n1);border:1px solid var(--n2)"></i>LOCKED</span><span><i style="border:1px solid var(--warn2)"></i>BREAKTHROUGH</span></div>
      </div>
      ${inspector(h, n)}
    </div></div>
  </section>${taskbar('personnel')}`;
}

function treeSvg(h) {
  const tree = TREES[h], W = 64, Hh = 32, D = 7;
  const pos = (n) => [(n.x - n.y) * 52, (n.x + n.y) * 30];
  const xs = tree.map((n) => pos(n)[0]), ys = tree.map((n) => pos(n)[1]);
  const pad = 52, minx = Math.min(...xs) - pad, maxx = Math.max(...xs) + pad, miny = Math.min(...ys) - pad, maxy = Math.max(...ys) + pad + 20;
  let edges = '', nodes = '';
  for (const n of tree) for (const p of n.p) {
    const a = pos(n), b = pos(nodeOf(h, p)); const live = lvl(h, p) > 0;
    edges += `<path class="edge ${live ? 'live' : ''}" d="M${b[0]} ${b[1]} L${(a[0] + b[0]) / 2} ${b[1]} L${(a[0] + b[0]) / 2} ${a[1]} L${a[0]} ${a[1]}"/>`;
  }
  for (const n of tree) {
    const [x, y] = pos(n), s = state(h, n), big = n.kind === 'key' || n.kind === 'root' ? 1.25 : 1;
    const w = W * big / 2, hh = Hh * big / 2;
    const cls = ['node', s === 'owned' || s === 'owned-part' ? 'owned' : s, n.kind === 'key' ? 'key' : '', S.sel[h] === n.id ? 'sel' : ''].join(' ');
    const ic = icon(n.ic, 20, s === 'locked' ? 'var(--n4)' : HEROES[h].colour, s === 'locked' ? 'var(--n2)' : 'var(--n1)');
    nodes += `<g class="${cls}" data-pick="${n.id}" data-node-tip="${h}:${n.id}" tabindex="0" role="button" aria-label="${esc(n.name)}">
      <polygon class="side" points="${x - w},${y} ${x},${y + hh} ${x + w},${y} ${x + w},${y + D} ${x},${y + hh + D} ${x - w},${y + D}"/>
      <polygon class="top" points="${x - w},${y} ${x},${y - hh} ${x + w},${y} ${x},${y + hh}"/>
      <g class="ico" transform="translate(${x - 10},${y - 18})">${ic}</g>
      ${n.max > 1 ? `<text class="nlabel" x="${x + w - 4}" y="${y + hh + D + 10}" text-anchor="end" style="fill:${lvl(h, n.id) ? 'var(--warn2)' : 'var(--n4)'}">${lvl(h, n.id)}/${n.max}</text>` : ''}
      ${s === 'locked' ? `<g transform="translate(${x + 10},${y - 4})"><rect x="0" y="3" width="8" height="6" style="fill:var(--n3)"/><rect x="2" y="0" width="4" height="3" style="fill:none;stroke:var(--n3)"/></g>` : ''}
    </g>`;
  }
  return `<svg viewBox="${minx} ${miny} ${maxx - minx} ${maxy - miny}" preserveAspectRatio="xMidYMid meet" shape-rendering="crispEdges">${edges}${nodes}</svg>`;
}

function beforeAfter(h, n) {
  const l = lvl(h, n.id), m = (n.fx || '').match(/(\d+)%/);
  if (l >= n.max) return `<div class="ba"><div class="bah">MAXED</div><div class="bab"><div class="what">Level ${l} of ${n.max}. Nothing left to buy here.</div></div></div>`;
  if (m && n.max > 1) { const v = +m[1]; return `<div class="ba"><div class="bah">IF YOU BUY LEVEL ${l + 1}</div><div class="bab"><div class="from">+${v * l}%</div><div class="arrow">→</div><div class="to">+${v * (l + 1)}%</div><div class="what">${esc(n.fx.replace(/ per level\.?/, '.'))}</div></div></div>`; }
  if (n.max > 1) return `<div class="ba"><div class="bah">IF YOU BUY LEVEL ${l + 1}</div><div class="bab"><div class="from">${l}</div><div class="arrow">→</div><div class="to">${l + 1}</div><div class="what">levels of ${esc(n.name)}</div></div></div>`;
  return `<div class="ba"><div class="bah">IF YOU BUY IT</div><div class="bab"><div class="from">OFF</div><div class="arrow">→</div><div class="to">ON</div></div></div>`;
}
function inspector(h, n) {
  const s = state(h, n), l = lvl(h, n.id), c = cost(h, n), H = HEROES[h];
  const stName = { owned: 'OWNED', 'owned-part': 'CAN BUY', avail: 'CAN BUY', locked: 'LOCKED' }[s];
  const stCls = { owned: 'owned', 'owned-part': 'avail', avail: 'avail', locked: 'locked' }[s];
  const needs = n.p.map((p) => nodeOf(h, p)).filter((p) => lvl(h, p.id) === 0).map((p) => p.name);
  let act;
  if (s === 'owned') act = `<button class="btn" disabled><span>OWNED</span></button>`;
  else if (s === 'locked') act = `<button class="btn" disabled><span>LOCKED</span></button><div class="why">Needs ${needs.join(n.all ? ' and ' : ' or ')}</div>`;
  else if (c > S.cash) act = `<button class="btn" disabled><span>${money(c)}</span></button><div class="why">${money(c - S.cash)} short</div>`;
  else act = `<button class="btn primary big" id="buy"><span>BUY</span><span class="s">${money(c)}</span></button><div class="why">Leaves ${money(S.cash - c)}</div>`;
  return `<aside class="insp" aria-label="Selected upgrade">
    <div class="ih"><div class="big">${icon(n.ic, 40, s === 'locked' ? 'var(--n4)' : H.colour, 'var(--n2)')}</div><div>
      <h4>${esc(n.name)}</h4>
      <div class="chips"><span class="st ${stCls}">${stName}</span>${n.kind === 'key' ? '<span class="st key">BREAKTHROUGH</span>' : ''}${n.kind === 'root' ? '<span class="st owned">ROOT</span>' : ''}</div>
    </div></div>
    <div class="rows"><div><span>LEVEL</span><span>${l} / ${n.max}</span></div><div><span>ERA</span><span>${n.era}</span></div><div><span>NEXT COST</span><span class="${s === 'owned' ? 'dim' : c <= S.cash ? 'y' : ''}" style="${s !== 'owned' && c > S.cash ? 'color:var(--alarm2)' : ''}">${s === 'owned' ? '—' : money(c)}</span></div></div>
    ${beforeAfter(h, n)}
    ${n.fx ? `<div class="eff">${kwHtml(n.fx)}</div>` : ''}
    ${n.d ? `<div class="flav">${esc(n.d)}</div>` : ''}
    <div class="act">${act}</div>
  </aside>`;
}

document.addEventListener('click', (e) => {
  const tab = e.target.closest('[data-tab]'); if (tab) { S.tab = tab.dataset.tab; render(); return; }
  if (e.target.closest('#vb')) { S.view = 'before'; render(); return; }
  if (e.target.closest('#va')) { S.view = 'after'; render(); return; }
  if (e.target.closest('#shipToggle')) { S.shipReady = !S.shipReady; if (S.tab === 'hud') render(); else renderNotes(); return; }
  const g = e.target.closest('[data-go]'); if (g) { go(g.dataset.go); return; }
  const hero = e.target.closest('[data-hero]'); if (hero) { S.hero = hero.dataset.hero; render(); return; }
  const pick = e.target.closest('[data-pick]'); if (pick) { S.sel[S.hero] = pick.dataset.pick; render(); return; }
  if (e.target.closest('#buy')) {
    const n = nodeOf(S.hero, S.sel[S.hero]); const c = cost(S.hero, n);
    if (c <= S.cash) { S.cash -= c; OWN[S.hero][n.id] = lvl(S.hero, n.id) + 1; render(); S.fresh = null; const el = frame.querySelector(`.ownedgrid [data-pick="${n.id}"]`); if (el) { el.classList.add('new'); } }
    return;
  }
  const btn = e.target.closest('.btn'); if (btn && !btn.disabled) { btn.classList.remove('press'); void btn.offsetWidth; btn.classList.add('press'); }
  if (e.target.closest('#restamp')) { const s = $('#stamp'); s.classList.remove('go'); void s.offsetWidth; s.classList.add('go'); return; }
  const m = e.target.closest('[data-m]'); if (m) { const [k, v] = m.dataset.m.split(':'); M[k] = v; render(); return; }
  const v = e.target.closest('[data-v]'); if (v) { const [k, d] = v.dataset.v.split(':'); M[k] = Math.max(0, Math.min(10, M[k] + +d)); render(); return; }
  if (e.target.closest('#erase')) { M.armed = !M.armed; render(); return; }
});
frame.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-pick]')) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', { bubbles: true })); } });

const fit = () => frame.style.setProperty('--k', stage.clientWidth / 1280);
new ResizeObserver(fit).observe(stage); fit();
try { const t = location.hash.slice(1); if (TABS.some((x) => x.id === t)) S.tab = t; } catch {}
render();
})();
</script>
